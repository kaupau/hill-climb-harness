# Dream's station agent on the MuJoCo sim: the station's ~/.dreamlabs/station.yaml with the arms and cameras
# swapped for the sim (dream/sim_arm.py, dream/sim_camera.py) and its live-view section removed.
body: metal
follower_l:
  can_channel: sim
  gripper_hold_torque_nm: 1.5
  gripper_closed_deg: 0.0
  gripper_open_deg: 111.0
  home:
  - 0.1436
  - 0.0018
  - 0.0091
  - -0.0256
  - 0.2147
  - -0.03
follower_r:
  can_channel: sim
  gripper_hold_torque_nm: 1.5
  gripper_closed_deg: 0.0
  gripper_open_deg: 113.8
  home:
  - 0.008
  - 0.0005
  - -0.0419
  - 0.1758
  - -0.003
  - -0.0792
cameras:
- name: scene
  source: sim_camera.py:SimCamera
  width: 1280
  height: 720
  fps: 10
- name: wrist_l
  source: sim_camera.py:SimCamera
  width: 1280
  height: 720
  fps: 10
- name: wrist_r
  source: sim_camera.py:SimCamera
  width: 1280
  height: 720
  fps: 10
action_horizon: 48
stale_after_s: 0.5  # sim frames come at 10 fps from one render thread
max_stall_ticks: 240
max_ee_speed_m_s: 0.6
face_blur: false
